<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <title>Регистрация</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="#">Регистрация</a>
            <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Переключатель навигации">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link" href="/">Главная</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <h2>Регистрация</h2>

        <form method="POST">
            <div class="mb-3">
                <label for="Name" class="form-label">Имя</label>
                <input type="text" class="form-control" id="Name" name="Name" placeholder="Имя" required>
            </div>

            <div class="mb-3">
              <label for="Email" class="form-label">Email</label>
              <input type="email" class="form-control" id="Email" name="Email" placeholder="Email" required>
            </div>
   
            <div class="mb-3">
              <label for="Password" class="form-label">Пароль</label>
              <input type="password" class="form-control" id="Password" name="Password" placeholder="Пароль" required>
            </div>
   
            <button type="submit" class="btn btn-success mb-3">Зарегистрироваться</button>

        </form>

        <a class="nav-link" href="/login">Уже зарегистрированы?</a>
       
    </div>

</body>

</html>
